<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>BAILE DA MADRID 2.0 — Ingressos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ed1b24;--purple:#b30000;--cyan:#ff3b3b;--gold:#ff6b6b;
  --bg:#05030a;--card:rgba(15,10,25,.72);--line:rgba(255,255,255,.13);
  --muted:#aaa7b5;--green:#00f59b;--shadow:0 20px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}

/* Bloqueia zoom e gestos de ampliação em celulares, mantendo o scroll vertical */
html, body{
  touch-action:pan-y;
  -ms-touch-action:pan-y;
  overscroll-behavior-x:none;
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:#fff;font-family:Montserrat,sans-serif;overflow-x:hidden;
  background:#05030a;
}
body:before{
  content:"";position:absolute;top:0;left:0;width:100%;min-height:100vh;z-index:-5;
  background:
    linear-gradient(180deg,rgba(4,2,9,.45),rgba(4,2,9,.92)),
    url("capa.jpg") center/cover;
}
body:after{
  content:"";position:fixed;inset:0;z-index:-4;pointer-events:none;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,23,111,.28),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(237,27,36,.28),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(237,27,36,.10),transparent 30%);
  animation:ambient 9s ease-in-out infinite alternate;
}
@keyframes ambient{to{filter:hue-rotate(35deg) brightness(1.12);transform:scale(1.05)}}

.particles{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.35;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:75px 75px;animation:stars 25s linear infinite}
@keyframes stars{to{background-position:0 600px}}

.cover{
  position:fixed;inset:0;z-index:1000;display:block;padding:0;
  background:#000;overflow:hidden;transition:.7s;
}
.cover:before{
  content:"";
  position:absolute;inset:0;
